[workspace]
resolver = "2"
members = [
    "crates/loomer-core",
    "crates/loomer-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Loomer Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
url = { version = "2.5", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
adblock = { version = "0.9", default-features = false, features = ["embedded-domain-resolver"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true